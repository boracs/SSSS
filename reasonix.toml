t ($engine.RecognizeAsync($bitmap)) ([Windows.Media.Ocr.OcrResult])\nWrite-Output (\"=== IMAGEN \" + $args[0] + \" ===\")\nforeach ($line in $result.Lines) { Write-Output $line.Text }\nPSEOF\npowershell -NoProfile -ExecutionPolicy Bypass -File \"tmp/ocr6${i}.ps1\" -args $i; rm -f tmp/ocr6${i}.png tmp/ocr6${i}.ps1; done"]
